# ClipForge config — copy to clipforge.config.yaml (git-ignored) and fill in.
#
#   cp clipforge.config.example.yaml clipforge.config.yaml
#
# Every key is optional; leave a value empty to skip it. A real environment
# variable (or .env) with the same meaning always wins over this file. Another
# location can be chosen with CLIPFORGE_CONFIG=/path/to/file.yaml.
#
# Keys set here are used by the server for the dashboard, the CLI and MCP, so
# nothing has to be pasted into the browser. Never commit the filled-in copy.

llm:
  gemini:
    api_key: ""            # https://aistudio.google.com/app/apikey  -> GEMINI_API_KEY
    model: ""              # default gemini-3.1-flash-lite            -> GEMINI_MODEL
  # Optional: run the moment picker on any OpenAI-compatible server
  # (OpenAI, OpenRouter, Ollama, LM Studio, vLLM). Frame-based stages still use Gemini.
  openai_compatible:
    base_url: ""           # e.g. https://api.openai.com/v1 or http://localhost:11434/v1
    model: ""              # e.g. gpt-4.1-mini, qwen2.5:14b
    api_key: ""
    timeout_seconds:       # default 600
    score_batch:           # windows per scoring call (default 3 local, 8 Gemini)
  provider: ""             # force "gemini" to ignore base_url; empty = auto

elevenlabs:
  api_key: ""              # voice dubbing / TTS                     -> ELEVENLABS_API_KEY

fal:
  api_key: ""              # AI Shorts (actors, lip-sync)            -> FAL_KEY

upload_post:
  api_key: ""              # https://app.upload-post.com/api-keys    -> UPLOAD_POST_API_KEY
  profile: ""              # Upload-Post profile username to post as -> UPLOAD_POST_PROFILE

youtube:
  # Netscape-format cookies.txt for downloading sources you are allowed to use
  # (path relative to this file or absolute). Its contents go to YOUTUBE_COOKIES.
  download_cookies_file: ""
  # --- Direct upload to your channel (see docs/clipforge/USER_GUIDE.md) ---
  oauth_client_file: ""    # Google Cloud OAuth client JSON (type "Desktop app")
  auto_upload: false       # true = upload the best clips when a job finishes
  privacy: private         # private | unlisted | public (public needs a rights record)
  schedule_times: []       # e.g. ["18:00", "21:00"]: scheduled publishing slots
  timezone: Asia/Kolkata   # for schedule_times
  max_per_day: 6           # API quota guard (~1,600 of 10,000 units per upload)
  max_per_job: 3           # auto-upload at most this many clips per video
  min_score: 60            # auto-upload only clips scoring at least this
  require_keep: false      # true = auto-upload only clips you marked keep/pin
  use_final: true          # upload the packaged final_ file when one exists
  category_id: "22"        # 22 People & Blogs, 27 Education, 24 Entertainment
  default_tags: []         # added to every upload, e.g. ["podcast"]

rights:
  # Your standing declaration for jobs without their own rights record
  # (dashboard: "source rights"). own | licensed | cc | public_domain | unclear.
  # Unclear sources only ever upload as private/unlisted.
  default_category: unclear
  default_license: ""      # e.g. "CC BY 4.0"
  default_attribution: ""  # e.g. "Source: <show> by <creator> (link)"

storage:
  s3:                      # optional clip backup (S3 / R2 / MinIO)
    access_key_id: ""
    secret_access_key: ""
    region: ""
    bucket: ""
    public_bucket: ""

transcription:
  backend: ""              # whisper (default) | parakeet (GPU)
  whisper_model: ""        # small (default) | medium | large-v3-turbo (best captions)
  whisper_device: ""       # cpu | cuda
  whisper_compute: ""      # int8 (CPU) | float16 (GPU)

processing:
  max_concurrent_jobs:     # CPU-only laptop: 1
  clip_workers:            # clips rendered in parallel per job; CPU-only: 2
  ffmpeg_encoder: ""       # x264 (default) | nvenc | auto
  job_retention_seconds:   # self-host default 86400 (24 h); 2592000 = 30 days

render:
  quality_preset: hd       # hd = fixed 1080x1920, lanczos, near-lossless intermediates,
                           #      48 kHz/192k AAC; legacy = upstream OpenShorts settings
  speech_cleanup: true     # highpass + light denoise + gentle compression before loudness
  loudness_normalize: true # -14 LUFS (platform playback level)
  quality_checks: true     # QC report per clip (ffprobe, black/frozen/silence, loudness)

branding:
  # Your own packaging around every excerpt (dashboard "Finish" button, or
  # automatically with auto_package). All optional.
  logo_path: ""            # PNG with transparency; relative to this file or absolute
  logo_corner: top-right   # top-left | top-right | bottom-left | bottom-right
  accent_color: "#FFE500"  # title colour on intro/outro cards
  outro_text: ""           # e.g. "Full episode on my channel"
  credit_text: ""          # e.g. "Source: <show> by <creator>, CC BY" (attribution)
  auto_package: false      # true = every clip also gets a final_ file with the above
  auto_intro_card: false   # true = auto-packaged clips open on a topic/context card

clips:
  min_seconds:             # default 15
  max_seconds:             # default 60 (YouTube Shorts allow up to 180)
  source_map: true         # whole-episode summary/topics as picker context (1 extra call)
  sentence_boundaries: true  # cut on whole sentences, keep questions with answers

# Any other environment variable the app reads, verbatim (UPPER_CASE names).
env: {}
